<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Johann M – Evil Mode Demo</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #222;
      color: white;
      margin: 20px;
      text-align: center;
    }

    /* --- Buttons Container --- */
    .mode-switch {
      margin-top: 40px;
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    /* --- Evil Mode Button --- */
    #evilBtn {
      position: relative;
      padding: 12px 28px;
      border-radius: 8px;
      border: none;
      background: transparent;
      cursor: pointer;
      user-select: none;
      font-weight: bold;
      font-size: 1.1rem;
      color: white;
      overflow: visible;
      outline: none;
      transition: background-color 0.3s ease;
    }

    /* Blur Background Layer */
    #evilBtn.locked::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      border-radius: 8px;
      background: rgba(139, 0, 0, 0.8);
      filter: blur(5px);
      z-index: 0;
    }

    /* Schloss-Icon Layer */
    #evilBtn.locked .lock-icon {
      position: absolute;
      top: -34px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 2.2rem;
      color: white;
      text-shadow: 0 0 8px black;
      z-index: 2;
      pointer-events: none;
      user-select: none;
    }

    /* Text Layer */
    #evilBtn.locked .btn-text {
      position: relative;
      z-index: 3;
      text-shadow: 0 0 5px black;
      color: white;
    }

    /* Wenn unlocked */
    #evilBtn.unlocked {
      background-color: #b22222;
      filter: none !important;
      color: white;
      cursor: pointer;
    }
    #evilBtn.unlocked .lock-icon {
      display: none;
    }

    /* --- Popup Overlay --- */
    #overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: rgba(0,0,0,0.6);
      backdrop-filter: blur(6px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10000;
      visibility: hidden;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    #overlay.visible {
      visibility: visible;
      opacity: 1;
    }

    /* Popup Box */
    .popup {
      background: #fff;
      color: #000;
      border-radius: 14px;
      width: 320px;
      max-width: 90vw;
      padding: 24px 24px 20px 24px;
      box-shadow: 0 0 25px rgba(0,0,0,0.5);
      position: relative;
      text-align: center;
      font-family: Arial, sans-serif;
    }

    .popup p {
      font-size: 1.15rem;
      margin-bottom: 12px;
      font-weight: 600;
    }

    /* Close button */
    .popup .close-btn {
      position: absolute;
      top: 10px;
      right: 14px;
      font-size: 22px;
      font-weight: bold;
      color: #444;
      cursor: pointer;
      user-select: none;
      transition: color 0.2s ease;
    }
    .popup .close-btn:hover {
      color: #000;
    }

    /* Input */
    #evilPassword {
      width: 100%;
      padding: 10px 12px;
      font-size: 1rem;
      border-radius: 6px;
      border: 1.8px solid #ccc;
      margin-bottom: 12px;
      box-sizing: border-box;
    }

    /* Submit Button */
    #submitPassword {
      padding: 10px 20px;
      background-color: #b22222;
      border: none;
      border-radius: 6px;
      color: white;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: background-color 0.3s ease;
      width: 100%;
    }
    #submitPassword:hover {
      background-color: #800000;
    }

    /* Passwort Meldung */
    #passwordMsg {
      font-weight: 700;
      min-height: 1.3em;
      font-size: 1rem;
      margin-top: 6px;
    }
    #passwordMsg.error {
      color: red;
    }
    #passwordMsg.success {
      color: green;
    }

  </style>
</head>
<body>

  <h1>Johann AI by Smyle</h1>

  <div class="mode-switch">
    <!-- Beispiel andere Buttons -->
    <button class="mode-btn">😈 Johann</button>
    <button class="mode-btn">😎 Rizz AI</button>
    <button class="mode-btn">🤖 GPT Classic</button>
    <button class="mode-btn" id="evilBtn" class="mode-btn evil locked" data-mode="evil">
      <span class="lock-icon">🔒</span>
      <span class="btn-text">Evil Mode</span>
    </button>
  </div>

  <!-- Password Overlay -->
  <div id="overlay" role="dialog" aria-modal="true" aria-labelledby="popupTitle" tabindex="-1">
    <div class="popup">
      <span class="close-btn" id="closePopup" title="Schließen">×</span>
      <p id="popupTitle">Enter password to unlock Evil Mode:</p>
      <input type="password" id="evilPassword" placeholder="Enter password..." autocomplete="off" />
      <div id="passwordMsg"></div>
      <button id="submitPassword">Submit</button>
    </div>
  </div>

  <script>
    const evilBtn = document.getElementById("evilBtn");
    const overlay = document.getElementById("overlay");
    const passwordInput = document.getElementById("evilPassword");
    const passwordMsg = document.getElementById("passwordMsg");
    const closePopupBtn = document.getElementById("closePopup");
    const submitBtn = document.getElementById("submitPassword");

    const SESSION_KEY = "evilModeUnlocked";

    // Prüfe Unlock Status
    function checkUnlockStatus() {
      if (sessionStorage.getItem(SESSION_KEY) === "true") {
        unlockEvilMode();
      } else {
        lockEvilMode();
      }
    }

    function lockEvilMode() {
      evilBtn.classList.remove("unlocked");
      evilBtn.classList.add("locked");
      // Entferne pointer-events none, soll klickbar sein um Popup zu öffnen
      evilBtn.style.pointerEvents = "auto";
    }

    function unlockEvilMode() {
      evilBtn.classList.remove("locked");
      evilBtn.classList.add("unlocked");
      evilBtn.style.pointerEvents = "auto";
    }

    function showPasswordPrompt() {
      passwordInput.value = "";
      passwordMsg.textContent = "";
      passwordMsg.className = "";
      overlay.classList.add("visible");
      passwordInput.focus();
    }

    function closePasswordPrompt() {
      overlay.classList.remove("visible");
    }

    function checkPassword() {
      const entered = passwordInput.value.trim();
      if (entered === "vape") {
        passwordMsg.textContent = "Successful!";
        passwordMsg.className = "success";
        sessionStorage.setItem(SESSION_KEY, "true");

        setTimeout(() => {
          closePasswordPrompt();
          unlockEvilMode();
          alert("Evil Mode aktiviert!");
        }, 800);
      } else {
        passwordMsg.textContent = "Wrong password!";
        passwordMsg.className = "error";
      }
    }

    // Events
    evilBtn.addEventListener("click", () => {
      if (evilBtn.classList.contains("locked")) {
        showPasswordPrompt();
      } else {
        alert("Evil Mode ist schon aktiviert!");
      }
    });

    submitBtn.addEventListener("click", checkPassword);

    closePopupBtn.addEventListener("click", closePasswordPrompt);

    passwordInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") checkPassword();
      if (e.key === "Escape") closePasswordPrompt();
    });

    window.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && overlay.classList.contains("visible")) {
        closePasswordPrompt();
      }
    });

    // Beim Laden prüfen
    checkUnlockStatus();
  </script>
</body>
</html>
