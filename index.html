<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Johann M – by Lächelmann</title>
  <link rel="stylesheet" href="style.css" />

  <style>
    .mode-switch{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
    .mode-btn{padding:6px 12px;border:none;border-radius:8px;background:#444;color:#fff;cursor:pointer;font-size:.9rem}
    .mode-btn.active{background:#007bff}
    #theme-icon{font-size:1.4rem;margin-right:8px;user-select:none}
    .title-bar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
    .version-text{font-size:.85rem;color:#888}
    #image-input{color:#fff}

    /* Evil Mode Locked Style */
    .mode-btn.evil.locked {
      filter: blur(1px);
      backdrop-filter: blur(4px);
      font-size: 16px;
    }

    /* Overlay */
    .overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-color: rgba(0,0,0,0.6);
      backdrop-filter: blur(5px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .popup {
      background: #fff;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      max-width: 300px;
      width: 90%;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
      color: #000;
    }

    .popup input[type="password"] {
      padding: 8px;
      width: 100%;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    .popup button {
      padding: 8px 12px;
      border: none;
      background-color: #007bff;
      color: white;
      border-radius: 6px;
      cursor: pointer;
    }

    .popup button:hover {
      background-color: #0056b3;
    }

    .password-msg {
      font-weight: bold;
      margin-top: 5px;
    }

    .password-msg.error {
      color: red;
    }

    .password-msg.success {
      color: green;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>
  <div class="container">

    <div class="rainbow-bar"></div>

    <div class="title-bar">
      <div style="display:flex;align-items:center;gap:10px;">
        <h1 id="title">Johann AI by Smyle</h1>
        <span class="version-text">Version: Alpha 1.1</span>
      </div>
      <div style="display:flex;align-items:center;">
        <span id="theme-icon">🌙</span>
        <label class="theme-toggle" style="margin:0;">
          <input type="checkbox" id="theme-checkbox" />
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <div class="chat-display" id="chat-display"></div>

    <div class="input-section">
      <input type="text" id="user-input" placeholder="Nachricht eingeben...">
      <input type="file" id="image-input" accept="image/*" style="display:none;">
      <label for="image-input" class="file-btn" title="Bild anhängen">📎</label>
      <button id="send-btn" class="send-btn">Senden</button>
    </div>

    <div class="mode-switch">
      <button class="mode-btn active" data-mode="johann">😈 Johann</button>
      <button class="mode-btn" data-mode="rizz">😎 Rizz AI</button>
      <button class="mode-btn" data-mode="classic">🤖 GPT Classic</button>
      <button class="mode-btn" data-mode="mental">Mental Health 🚬</button>
      <button class="mode-btn" data-mode="coding">Coding 👨‍💻</button>
      <button class="mode-btn" data-mode="human">Human AI 👤</button>
      <button class="mode-btn evil locked" onclick="showPasswordPrompt()">🔒 Evil Mode</button>
    </div>

    <div class="extra-buttons">
      <button class="extra" id="clear-btn">Clear</button>
    </div>

    <!-- Password Overlay -->
    <div id="overlay" class="overlay hidden">
      <div class="popup">
        <p>Enter password to unlock Evil Mode:</p>
        <input type="password" id="evilPassword" placeholder="Enter password...">
        <div id="passwordMsg" class="password-msg"></div>
        <button onclick="checkPassword()">Submit</button>
      </div>
    </div>

  </div>

  <script>
    function showPasswordPrompt() {
      document.getElementById("overlay").classList.remove("hidden");
      document.getElementById("evilPassword").value = "";
      document.getElementById("passwordMsg").textContent = "";
    }

    function checkPassword() {
      const passwordInput = document.getElementById("evilPassword");
      const msg = document.getElementById("passwordMsg");
      const overlay = document.getElementById("overlay");
      const evilBtn = document.querySelector(".mode-btn.evil");

      if (passwordInput.value === "vape") {
        msg.textContent = "Successful!";
        msg.className = "password-msg success";

        setTimeout(() => {
          overlay.classList.add("hidden");
          evilBtn.classList.remove("locked");
          evilBtn.innerHTML = "👿 Evil Mode";
          evilBtn.setAttribute("data-mode", "evil");
        }, 1000);
      } else {
        msg.textContent = "Wrong password!";
        msg.className = "password-msg error";
      }
    }
  </script>

  <script src="main.js"></script>
</body>
</html>
