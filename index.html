<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Johann M – by Lächelmann</title>
  <link rel="stylesheet" href="style.css" />

  <style>
    .mode-switch{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
    .mode-btn{padding:6px 12px;border:none;border-radius:8px;background:#444;color:#fff;cursor:pointer;font-size:.9rem; position: relative;}
    .mode-btn.active{background:#007bff}
    #theme-icon{font-size:1.4rem;margin-right:8px;user-select:none}
    .title-bar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
    .version-text{font-size:.85rem;color:#888}
    #image-input{color:#fff}

    /* Evil Mode Locked Style */
    .mode-btn.evil.locked {
      filter: blur(2px);
      cursor: default;
      pointer-events: none; /* Kein Klick solange gesperrt */
      color: transparent; /* Text unsichtbar */
    }

    /* Schloss-Overlay über Evil Mode Button */
    .mode-btn.evil.locked::after {
      content: "🔒 Es ist verschlossen";
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-weight: bold;
      font-size: 14px;
      pointer-events: none;
      user-select: none;
      white-space: nowrap;
      text-shadow: 0 0 5px black;
    }

    /* Overlay */
    .overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-color: rgba(0,0,0,0.6);
      backdrop-filter: blur(5px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .popup {
      background: #fff;
      padding: 20px 20px 15px 20px;
      border-radius: 12px;
      text-align: center;
      max-width: 300px;
      width: 90%;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
      color: #000;
      position: relative;
    }

    .popup input[type="password"] {
      padding: 8px;
      width: 100%;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 1rem;
    }

    .popup button.submit-btn {
      padding: 8px 12px;
      border: none;
      background-color: #007bff;
      color: white;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1rem;
    }

    .popup button.submit-btn:hover {
      background-color: #0056b3;
    }

    .password-msg {
      font-weight: bold;
      margin-top: 5px;
      min-height: 1.3em;
      font-size: 0.95rem;
    }

    .password-msg.error {
      color: red;
    }

    .password-msg.success {
      color: green;
    }

    .hidden {
      display: none;
    }

    /* Close X Button */
    .popup .close-btn {
      position: absolute;
      top: 8px;
      right: 12px;
      font-size: 20px;
      font-weight: bold;
      color: #666;
      cursor: pointer;
      user-select: none;
    }

    .popup .close-btn:hover {
      color: #000;
    }
  </style>
</head>

<body>
  <div class="container">

    <div class="rainbow-bar"></div>

    <div class="title-bar">
      <div style="display:flex;align-items:center;gap:10px;">
        <h1 id="title">Johann AI by Smyle</h1>
        <span class="version-text">Version: Alpha 2.1</span>
      </div>
      <div style="display:flex;align-items:center;">
        <span id="theme-icon">🌙</span>
        <label class="theme-toggle" style="margin:0;">
          <input type="checkbox" id="theme-checkbox" />
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <div class="chat-display" id="chat-display"></div>

    <div class="input-section">
      <input type="text" id="user-input" placeholder="Nachricht eingeben...">
      <input type="file" id="image-input" accept="image/*" style="display:none;">
      <label for="image-input" class="file-btn" title="Bild anhängen">📎</label>
      <button id="send-btn" class="send-btn">Senden</button>
    </div>

<div class="mode-switch">
  <button class="mode-btn active" data-mode="johann">😈 Johann</button>
  <button class="mode-btn" data-mode="rizz">😎 Rizz AI</button>
  <button class="mode-btn" data-mode="classic">🤖 GPT Classic</button>
  <button class="mode-btn" data-mode="mental">Mental Health 🚬</button>
  <button class="mode-btn" data-mode="coding">Coding 👨‍💻</button>
  <button class="mode-btn" data-mode="human">Human AI 👤</button>
  <button class="mode-btn evil locked" data-mode="evil">
    <span class="lock-icon">🔒</span>
    Evil Mode
  </button>
</div>

<div class="extra-buttons">
  <button class="extra" id="clear-btn">Clear</button>
</div>



    <!-- Password Overlay -->
    <div id="overlay" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="popupTitle" tabindex="-1">
      <div class="popup">
        <span class="close-btn" id="closePopup" title="Schließen">×</span>
        <p id="popupTitle">Enter password to unlock Evil Mode:</p>
        <input type="password" id="evilPassword" placeholder="Enter password..." autocomplete="off" />
        <div id="passwordMsg" class="password-msg"></div>
        <button class="submit-btn" id="submitPassword">Submit</button>
      </div>
    </div>

  </div>

  <script src="main.js"></script>
</body>
</html>
