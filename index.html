<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Johann M – by Lächelmann</title>
  <link rel="stylesheet" href="style.css" />

  <style>
    /* Bestehende Styles bleiben erhalten */

    /* Modus-Fenster und Pfeil-Button */
    .open-mode-btn {
      background: transparent;
      border: none;
      color: white;
      font-size: 1.5rem;
      cursor: pointer;
      padding: 0;
      font-weight: bold;
      margin-top: 10px;
    }

    .mode-window {
      position: fixed;
      top: 0;
      right: -100%;  /* Startet außerhalb des Bildschirms */
      width: 50%;
      height: 100%;
      background-color: #333;
      color: white;
      transition: right 0.3s ease; /* Schiebe-Effekt */
      z-index: 1000;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding-top: 50px;
    }

    .mode-window-content {
      width: 90%;
    }

    .mode-window h2 {
      text-align: center;
      font-size: 1.5rem;
      margin-bottom: 20px;
    }

    .mode-btn {
      padding: 10px;
      border: none;
      border-radius: 8px;
      background: #444;
      color: white;
      cursor: pointer;
      font-size: 0.95rem;
      transition: 0.2s;
      margin-bottom: 10px;
      width: 100%;
    }

    .mode-btn.active {
      background: #007bff;
    }

    /* Verstecken des Modus-Fensters, wenn es geschlossen ist */
    .hidden {
      display: none;
    }

  </style>
</head>

<body>
  <div class="container">

    <div class="rainbow-bar"></div>

    <div class="title-bar">
      <div style="display:flex;align-items:center;gap:10px;">
        <h1 id="title">Johann AI by Smyle</h1>
        <span class="version-text">Version: Alpha 2.1</span>
      </div>
      <div style="display:flex;align-items:center;">
        <span id="theme-icon">🌙</span>
        <label class="theme-toggle" style="margin:0;">
          <input type="checkbox" id="theme-checkbox" />
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <!-- Pfeil-Button unter dem Dark Mode Toggle -->
    <button id="openModeWindow" class="open-mode-btn">⇨</button>

    <!-- Das Mode-Windows, das von rechts nach links schiebt -->
    <div id="modeWindow" class="mode-window hidden">
      <div class="mode-window-content">
        <span id="closeModeWindow" class="close-btn">×</span>
        <h2>Mode</h2>
        <div class="mode-switch">
          <button class="mode-btn active" data-mode="johann">☝ Johann</button>
          <button class="mode-btn" data-mode="rizz">😎 Rizz AI</button>
          <button class="mode-btn" data-mode="classic">🤖 GPT Classic</button>
          <button class="mode-btn" data-mode="mental">Mental Health 🚬</button>
          <button class="mode-btn" data-mode="coding">Coding 👨‍💻</button>
          <button class="mode-btn" data-mode="human">Human AI 👤</button>
          <button id="evilBtn" class="mode-btn evil locked" data-mode="evil">🚨Evil Mode🚨</button>
        </div>
      </div>
    </div>

    <div class="chat-display" id="chat-display"></div>

    <div class="input-section">
      <input type="text" id="user-input" placeholder="Nachricht eingeben...">
      <input type="file" id="image-input" accept="image/*" style="display:none;">
      <label for="image-input" class="file-btn" title="Bild anhängen">📎</label>
      <button id="send-btn" class="send-btn">Senden</button>
    </div>

    <div class="mode-switch">
      <button class="mode-btn active" data-mode="johann">☝ Johann</button>
      <button class="mode-btn" data-mode="rizz">😎 Rizz AI</button>
      <button class="mode-btn" data-mode="classic">🤖 GPT Classic</button>
      <button class="mode-btn" data-mode="mental">Mental Health 🚬</button>
      <button class="mode-btn" data-mode="coding">Coding 👨‍💻</button>
      <button class="mode-btn" data-mode="human">Human AI 👤</button>

      <button id="evilBtn" class="mode-btn evil locked" data-mode="evil">🚨Evil Mode🚨</button>

      <span id="evilLock" class="lock-icon-overlay">🔒</span>
    </div>

    <div class="extra-buttons">
      <button class="extra" id="clear-btn">Clear</button>
    </div>

    <div id="overlay" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="popupTitle" tabindex="-1">
      <div class="popup">
        <span class="close-btn" id="closePopup" title="Schließen">×</span>
        <p id="popupTitle">Enter password to unlock Evil Mode:</p>
        <input type="password" id="evilPassword" placeholder="Enter password..." autocomplete="off" />
        <div id="passwordMsg" class="password-msg"></div>
        <button class="submit-btn" id="submitPassword">Submit</button>
      </div>
    </div>

  </div>

  <script src="main.js"></script>

  <script>
    // Öffnet das Modus-Fenster, wenn der Pfeil-Button gedrückt wird
    document.getElementById('openModeWindow').addEventListener('click', function() {
      document.getElementById('modeWindow').classList.remove('hidden');
      document.getElementById('modeWindow').style.right = '0';
    });

    // Schließt das Modus-Fenster, wenn der Schließen-Button gedrückt wird
    document.getElementById('closeModeWindow').addEventListener('click', function() {
      document.getElementById('modeWindow').style.right = '-100%';
      setTimeout(function() {
        document.getElementById('modeWindow').classList.add('hidden');
      }, 300);
    });
    
    // Funktion für den Lock-Icon, falls Evil Mode verwendet wird
    function positionLockIcon() {
      const btn = document.getElementById('evilBtn');
      const icon = document.getElementById('evilLock');
      const rect = btn.getBoundingClientRect();

      icon.style.top = `${btn.offsetTop + btn.offsetHeight / 2}px`;
      icon.style.left = `${btn.offsetLeft + btn.offsetWidth / 2}px`;
    }

    window.addEventListener('load', positionLockIcon);
    window.addEventListener('resize', positionLockIcon);
  </script>
</body>
</html>
