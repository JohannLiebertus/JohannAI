<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Johann M – KI-Chatbot</title>
  <link rel="stylesheet" href="style.css">

    <style>
  .mode-switch {
    margin-top: 10px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .mode-btn {
    padding: 6px 12px;
    border: none;
    border-radius: 8px;
    background-color: #444;
    color: white;
    cursor: pointer;
    font-size: 0.9rem;
  }
  .mode-btn.active {
    background-color: #007bff;
  }
</style>


</head>

<body>
  <div class="container">

    <div class="rainbow-bar"></div>

    <div class="title-bar">
      <h1 id="title">Johann AI by Smyle</h1>
      <label class="theme-toggle">
        <input type="checkbox" id="theme-checkbox">
        <span class="slider"></span>
      </label>
    </div>

    <div class="chat-display" id="chat-display">
      <!-- Chatverlauf erscheint hier -->
    </div>

    <div class="input-section">
      <input type="text" id="user-input" placeholder="Schreib etwas...">
      <button class="send-btn" id="send-btn">Senden</button>
    </div>

    <div class="mode-switch">
  <label>Modus:</label>
  <button class="mode-btn" data-mode="johann">🧊 Johann</button>
  <button class="mode-btn" data-mode="rizz">😎 Rizz AI</button>
  <button class="mode-btn" data-mode="classic">🤖 GPT Classic</button>
</div>


    <div class="extra-buttons">
      <button class="extra" id="clear-btn">Clear</button>
    </div>

  </div>

  <script src="main.js"></script>
</body>
</html>
