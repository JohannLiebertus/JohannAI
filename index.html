<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Johann M – by Lächelmann</title>
  <link rel="stylesheet" href="style.css" />

  <style>
    .mode-switch {
      margin-top: 10px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      position: relative;
    }

    .mode-btn {
      padding: 6px 12px;
      border: none;
      border-radius: 8px;
      background: #444;
      color: #fff;
      cursor: pointer;
      font-size: .9rem;
      position: relative;
    }

    .mode-btn.active {
      background: #007bff;
    }

    #theme-icon {
      font-size: 1.4rem;
      margin-right: 8px;
      user-select: none;
    }

    .title-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }

    .version-text {
      font-size: .85rem;
      color: #888;
    }

    #image-input {
      color: #fff;
    }

    
    .mode-btn.evil.locked {
      position: relative;
      filter: blur(3px);
      color: transparent;
      background: #222;
      pointer-events: none;
    }

    
    .lock-icon-overlay {
      position: absolute;
      font-size: 1.6rem;
      color: white;
      z-index: 10;
      pointer-events: none;
      text-shadow: 0 0 6px black;
      user-select: none;
      transform: translate(-50%, -50%);
    }

    
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(5px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .popup {
      background: #fff;
      padding: 20px 20px 15px 20px;
      border-radius: 12px;
      text-align: center;
      max-width: 300px;
      width: 90%;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
      color: #000;
      position: relative;
    }

    .popup input[type="password"] {
      padding: 8px;
      width: 100%;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 1rem;
    }

    .popup button.submit-btn {
      padding: 8px 12px;
      border: none;
      background-color: #007bff;
      color: white;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1rem;
    }

    .popup button.submit-btn:hover {
      background-color: #0056b3;
    }

    .password-msg {
      font-weight: bold;
      margin-top: 5px;
      min-height: 1.3em;
      font-size: 0.95rem;
    }

    .password-msg.error {
      color: red;
    }

    .password-msg.success {
      color: green;
    }

    .hidden {
      display: none;
    }

    .popup .close-btn {
      position: absolute;
      top: 8px;
      right: 12px;
      font-size: 20px;
      font-weight: bold;
      color: #666;
      cursor: pointer;
      user-select: none;
    }

    .popup .close-btn:hover {
      color: #000;
    }

    .mode-panel {
  position: fixed;
  top: 60px;
  right: -50%;
  width: 50%;
  height: 100%;
  background-color: #1f1f1f;
  border-left: 2px solid #333;
  box-shadow: -5px 0 15px rgba(0, 0, 0, 0.5);
  padding: 1rem;
  transition: right 0.4s ease;
  z-index: 999;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.mode-panel.open {
  right: 0;
}

.mode-panel h2 {
  font-size: 1.5rem;
  color: #0ff;
  margin-bottom: 1rem;
  text-shadow: 0 0 5px #0ff, 0 0 10px #0ff;
  animation: neon-glow 1.5s infinite alternate;
}

@keyframes neon-glow {
  from {
    text-shadow: 0 0 5px #0ff, 0 0 10px #0ff;
  }
  to {
    text-shadow: 0 0 15px #0ff, 0 0 25px #0ff;
  }
}

.mode-buttons {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  width: 100%;
  justify-items: center;
}

.mode-buttons .mode-btn {
  width: 100%;
  padding: 10px;
  border: none;
  border-radius: 8px;
  background: #444;
  color: white;
  cursor: pointer;
  font-size: 0.95rem;
  transition: 0.2s;
  text-align: center;
}

.mode-buttons .mode-btn.evil {
  grid-column: span 2;
  justify-self: center;
  background: linear-gradient(180deg, #8B0000 0%, #FF4C4C 100%);
  color: white;
  border: 2px solid #5A0000;
  box-shadow: 0 4px 6px rgba(139, 0, 0, 0.6);
  text-shadow: 0 0 5px #FF0000;
}

.toggle-mode-panel {
  position: absolute;
  top: 60px;
  right: 10px;
  background: transparent;
  color: white;
  font-size: 20px;
  border: none;
  cursor: pointer;
  z-index: 1000;
  transition: transform 0.3s ease;
}

.toggle-mode-panel.open {
  transform: rotate(180deg);
}


  </style>
</head>

<body>

    <div class="rainbow-bar"></div>

    <div class="title-bar">
      <div style="display:flex;align-items:center;gap:10px;">
        <h1 id="title">Johann AI by Smyle</h1>
        <span class="version-text">Version: Alpha 2.1</span>
      </div>
      <div style="display:flex;align-items:center;">
        <span id="theme-icon">🌙</span>
        <label class="theme-toggle" style="margin:0;">
          <input type="checkbox" id="theme-checkbox" />
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <div class="chat-display" id="chat-display"></div>

<div class="input-section">
  <input type="text" id="user-input" placeholder="Write...">
  <button id="send-btn" class="send-btn">Send</button>
  <label for="image-input" class="file-btn">📎</label>
  <input type="file" id="image-input" accept="image/*" style="display:none;">
</div>


<!-- Button: Toggle Panel -->
<button id="togglePanel" class="toggle-mode-panel">➤</button>

<!-- Slide-In Mode Panel -->
<div id="modePanel" class="mode-panel">
  <h2>Mode</h2>
  <div class="mode-buttons">
    <button class="mode-btn" data-mode="johann">☝ Johann</button>
    <button class="mode-btn" data-mode="rizz">😎 Rizz AI</button>
    <button class="mode-btn" data-mode="classic">🤖 GPT Classic</button>
    <button class="mode-btn" data-mode="mental">Mental Health 🚬</button>
    <button class="mode-btn" data-mode="coding">Coding 👨‍💻</button>
    <button class="mode-btn" data-mode="human">Human AI 👤</button>
    <button id="evilBtnPanel" class="mode-btn evil locked" data-mode="evil">🚨Evil Mode🚨</button>
  </div>
</div>


      
      
    </div>

    <div class="extra-buttons">
      <button class="extra" id="clear-btn">Clear</button>
    </div>

    
    <div id="overlay" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="popupTitle" tabindex="-1">
      <div class="popup">
        <span class="close-btn" id="closePopup" title="Schließen">×</span>
        <p id="popupTitle">Enter password to unlock Evil Mode:</p>
        <input type="password" id="evilPassword" placeholder="Enter password..." autocomplete="off" />
        <div id="passwordMsg" class="password-msg"></div>
        <button class="submit-btn" id="submitPassword">Submit</button>
      </div>
    </div>

  </div>
  
  <script src="main.js"></script>

  <script>
    function positionLockIcon() {
      const btn = document.getElementById('evilBtnPanel');
      const icon = document.getElementById('evilLock');
      const rect = btn.getBoundingClientRect();

      icon.style.top = `${btn.offsetTop + btn.offsetHeight / 2}px`;
      icon.style.left = `${btn.offsetLeft + btn.offsetWidth / 2}px`;
    }

    window.addEventListener('load', positionLockIcon);
    window.addEventListener('resize', positionLockIcon);
  </script>
  <script>
  const togglePanelBtn = document.getElementById("togglePanel");
  const modePanel = document.getElementById("modePanel");

  togglePanelBtn.addEventListener("click", () => {
    modePanel.classList.toggle("open");
    togglePanelBtn.classList.toggle("open");
  });
</script>

</body>
</html>
