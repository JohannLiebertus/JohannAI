<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Johann M – by Lächelmann</title>
  <link rel="stylesheet" href="style.css" />

  <style>
    body, html {
      height: 100%;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      font-family: Arial, sans-serif;
      background: #121212;
      color: #eee;
    }

    .rainbow-bar {
      height: 6px;
      background: linear-gradient(90deg, red, orange, yellow, green, blue, indigo, violet);
    }

    .title-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      padding: 10px 15px;
      background-color: #1f1f1f;
      border-bottom: 1px solid #333;
      flex-shrink: 0;
      user-select: none;
    }

    .title-bar h1 {
      margin: 0;
      font-size: 1.5rem;
      color: rgb(128, 8, 8);
      text-shadow: 0 0 5px rgb(75, 9, 4), 0 0 10px rgb(94, 7, 1);
      animation: neon-glow 1.5s infinite alternate;
    }

    @keyframes neon-glow {
      from {
        text-shadow: 0 0 5px rgb(241, 4, 4), 0 0 10px rgb(107, 0, 0);
      }
      to {
        text-shadow: 0 0 15px rgb(156, 2, 2), 0 0 25px rgb(73, 0, 0);
      }
    }

    .version-text {
      font-size: .85rem;
      color: #888;
    }

    #theme-icon {
      font-size: 1.4rem;
      margin-right: 8px;
      user-select: none;
    }

    .chat-display {
      flex: 1 1 auto;
      overflow-y: auto;
      padding: 1rem;
      background-color: #222;
      margin-bottom: 60px; /* Platz fürs input-section */
    }

    .input-section {
      flex-shrink: 0;
      display: flex;
      gap: 8px;
      padding: 10px;
      background-color: #1a1a1a;
      border-top: 1px solid #333;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      align-items: center;
      z-index: 100;
    }

    .input-section input[type="text"] {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      border: none;
      font-size: 1rem;
      outline: none;
      background: #333;
      color: #eee;
    }

    .input-section button,
    .input-section label.file-btn {
      background: #444;
      border: none;
      border-radius: 8px;
      color: #eee;
      padding: 10px 14px;
      cursor: pointer;
      font-size: 1.2rem;
      user-select: none;
      transition: background 0.3s ease;
    }

    .input-section button:hover,
    .input-section label.file-btn:hover {
      background: #666;
    }

    .mode-panel {
      position: fixed;
      top: 60px;
      right: -100%; /* komplett raus aus Sicht */
      width: 300px;
      height: calc(100% - 60px);
      background-color: #1f1f1f;
      border-left: 2px solid #333;
      box-shadow: -5px 0 15px rgba(0, 0, 0, 0.5);
      padding: 1rem;
      transition: right 0.4s ease;
      z-index: 999;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-y: auto;
    }

    .mode-panel.open {
      right: 0;
    }

    .mode-panel h2 {
      font-size: 1.5rem;
      color: #0ff;
      margin-bottom: 1rem;
      text-shadow: 0 0 5px #0ff, 0 0 10px #0ff;
      animation: neon-glow 1.5s infinite alternate;
    }

    .mode-buttons {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      width: 100%;
      justify-items: center;
    }

    .mode-buttons .mode-btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background: #444;
      color: white;
      cursor: pointer;
      font-size: 0.95rem;
      transition: 0.2s;
      text-align: center;
    }

    .mode-buttons .mode-btn.evil {
      grid-column: span 2;
      justify-self: center;
      background: linear-gradient(180deg, #8B0000 0%, #FF4C4C 100%);
      color: white;
      border: 2px solid #5A0000;
      box-shadow: 0 4px 6px rgba(139, 0, 0, 0.6);
      text-shadow: 0 0 5px #FF0000;
    }

    .toggle-mode-panel {
      position: absolute;
      top: 60px;
      right: 10px;
      background: transparent;
      color: white;
      font-size: 20px;
      border: none;
      cursor: pointer;
      z-index: 1000;
      transition: transform 0.3s ease;
      user-select: none;
    }

    .toggle-mode-panel.open {
      transform: rotate(180deg);
    }

    .mode-btn {
      padding: 6px 12px;
      border: none;
      border-radius: 8px;
      background: #444;
      color: #fff;
      cursor: pointer;
      font-size: .9rem;
      position: relative;
    }

    .mode-btn.active {
      background: #007bff;
    }

    #image-input {
      color: #fff;
    }

    .mode-btn.evil.locked {
      position: relative;
      filter: blur(3px);
      color: transparent;
      background: #222;
      pointer-events: none;
    }

    .lock-icon-overlay {
      position: absolute;
      font-size: 1.6rem;
      color: white;
      z-index: 10;
      pointer-events: none;
      text-shadow: 0 0 6px black;
      user-select: none;
      transform: translate(-50%, -50%);
    }

    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(5px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .popup {
      background: #fff;
      padding: 20px 20px 15px 20px;
      border-radius: 12px;
      text-align: center;
      max-width: 300px;
      width: 90%;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
      color: #000;
      position: relative;
    }

    .popup input[type="password"] {
      padding: 8px;
      width: 100%;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 1rem;
    }

    .popup button.submit-btn {
      padding: 8px 12px;
      border: none;
      background-color: #007bff;
      color: white;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1rem;
    }

    .popup button.submit-btn:hover {
      background-color: #0056b3;
    }

    .password-msg {
      font-weight: bold;
      margin-top: 5px;
      min-height: 1.3em;
      font-size: 0.95rem;
    }

    .password-msg.error {
      color: red;
    }

    .password-msg.success {
      color: green;
    }

    .hidden {
      display: none;
    }

    .popup .close-btn {
      position: absolute;
      top: 8px;
      right: 12px;
      font-size: 20px;
      font-weight: bold;
      color: #666;
      cursor: pointer;
      user-select: none;
    }

    .popup .close-btn:hover {
      color: #000;
    }
  </style>
</head>

<body>

  <div class="rainbow-bar"></div>

  <div class="title-bar">
    <div style="display:flex;align-items:center;gap:10px;">
      <h1 id="title">Johann AI by Smyle</h1>
      <span class="version-text">Version: Alpha 2.1</span>
    </div>
    <div style="display:flex;align-items:center;">
      <span id="theme-icon">🌙</span>
      <label class="theme-toggle" style="margin:0;">
        <input type="checkbox" id="theme-checkbox" />
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <div class="chat-display" id="chat-display"></div>

  <div class="input-section">
    <input type="text" id="user-input" placeholder="Write...">
    <button id="send-text-btn" class="send-btn">Send</button>
    <button id="send-icon-btn">➤</button>

    <label for="image-input" class="file-btn">📎</label>
    <input type="file" id="image-input" class="hidden" accept="image/*" />
  </div>

  <button class="toggle-mode-panel" id="toggle-mode-panel">⯈</button>

  <div class="mode-panel" id="mode-panel">
    <h2>Modus auswählen</h2>
    <div class="mode-buttons">
      <button class="mode-btn">Normal</button>
      <button class="mode-btn">Kreativ</button>
      <button class="mode-btn">Präzise</button>
      <button class="mode-btn">Humor</button>
      <button class="mode-btn evil locked">
        <span class="lock-icon-overlay">🔒</span>
        Evil Mode
      </button>
    </div>
  </div>

  <div class="overlay hidden" id="password-overlay">
    <div class="popup">
      <span class="close-btn" id="close-popup">&times;</span>
      <h3>Passwort eingeben</h3>
      <input type="password" id="evil-password" placeholder="Passwort" />
      <button class="submit-btn" id="submit-password">Entsperren</button>
      <div class="password-msg" id="password-msg"></div>
    </div>
  </div>

  <script>
    const togglePanelBtn = document.getElementById('toggle-mode-panel');
    const modePanel = document.getElementById('mode-panel');
    const evilBtn = document.querySelector('.mode-btn.evil.locked');
    const overlay = document.getElementById('password-overlay');
    const closeBtn = document.getElementById('close-popup');
    const submitPasswordBtn = document.getElementById('submit-password');
    const passwordInput = document.getElementById('evil-password');
    const passwordMsg = document.getElementById('password-msg');

    togglePanelBtn.addEventListener('click', () => {
      modePanel.classList.toggle('open');
      togglePanelBtn.classList.toggle('open');
    });

    evilBtn.addEventListener('click', () => {
      overlay.classList.remove('hidden');
    });

    closeBtn.addEventListener('click', () => {
      overlay.classList.add('hidden');
      passwordMsg.textContent = '';
      passwordInput.value = '';
    });

    submitPasswordBtn.addEventListener('click', () => {
      const correctPassword = "smylemode"; // Passwort hier anpassen
      if (passwordInput.value === correctPassword) {
        document.querySelector('.mode-btn.evil').classList.remove('locked');
        overlay.classList.add('hidden');
        passwordMsg.textContent = '';
        passwordInput.value = '';
      } else {
        passwordMsg.textContent = "Falsches Passwort.";
        passwordMsg.classList.add('error');
      }
    });
  </script>

</body>
</html>
